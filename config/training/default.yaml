max_epochs: 100
learning_rate: 0.001
weight_decay: 0.0001
optimizer_name: adam
scheduler_name: null

# AR: Autoregressive, TF: Teacher Forcing
training_mode: parallel_AR  # single, parallel_AR, parallel_TF

# Loss function
task_loss: mse
loss_weighting: exponential
reg_lambda: 0.01

# Early stopping
early_stopping_patience: 15
early_stopping_min_delta: 0.001

# Checkpointing
save_top_k: 3
monitor_metric: val_loss

# Hardware
gpus: 1
precision: 32

# Logging
log_theta_stats: true
log_every_n_steps: 50
deterministic: true